<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="description" content="F1 Live, suivi de la saison F1 2026 : classements, Grands Prix, rejeu de course, statistiques, météo, qualifications et comparateur de pilotes.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="F1 Live">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>F1 Live</title>
<script>
  // Applique le thème avant l'affichage pour éviter un flash.
  try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('f1v2:theme')) || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>
<div class="app">
  <aside class="side" id="side" aria-label="Navigation principale">
    <a class="brand" href="#/" aria-label="F1 Live, accueil">
      <span class="mark" aria-hidden="true">F1</span>
      <span class="brand-t"><b>F1 Live</b><i>Saison 2026</i></span>
    </a>
    <nav><ul id="nav" class="nav"></ul></nav>
    <div class="side-foot">
      <button type="button" class="link-btn" id="theme-btn">Passer en thème clair</button>
      <p>Données : Jolpica F1, OpenF1 et Open-Meteo.</p>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="col">
    <header class="top">
      <button type="button" class="icon-btn" id="menu-btn" aria-label="Ouvrir le menu" aria-controls="side" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="top-title"><b>F1 Live</b></span>
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <button type="button" class="btn small" id="refresh">Actualiser</button>
    </header>
    <main id="main" tabindex="-1"><div class="loading" role="status"><span class="dot"></span>Chargement…</div></main>
  </div>
</div>
<noscript><p class="notice" style="margin:1rem">Cette application a besoin de JavaScript pour afficher les données de la saison.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
